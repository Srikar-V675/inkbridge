[project]
name = "inkbridge"
version = "0.1.0"
description = "Inkbridge backend: API, recognizer worker and MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
inkbridge-mcp = "inkbridge.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
